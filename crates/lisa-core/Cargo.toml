[package]
name = "lisa-core"
version = "0.1.0"
edition = "2024"
description = "Lisa のスキャンの中身（Bevy に依存しない）"

[dependencies]
blake3 = "1.8.7"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
trash = "5.4.0"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSArray", "NSString", "NSDictionary", "NSValue", "NSError", "NSObject", "NSEnumerator"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_Power"] }
