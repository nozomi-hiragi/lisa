[package]
name = "lisa"
version = "0.1.0"
edition = "2024"

[workspace]
# スキャンの中身（Bevy に依存しない）と、それを試す CLI、MCP のサーバー。`cargo run` は今までどおりアプリを動かす。
members = ["crates/lisa-core", "crates/lisa-scan", "crates/lisa-mcp"]
default-members = ["."]

[features]
verify-fs = ["lisa-mcp/verify-fs"]

[dependencies]
bevy = "0.20.1"
lisa-core = { path = "crates/lisa-core" }
lisa-mcp = { path = "crates/lisa-mcp" }
ureq = { version = "3", default-features = false }
directories = "6.0.0"
# 日本語・中国語の改行位置データが無いという警告を、eprintln ではなくログとして出させて止めるため
# （main.rs のログの絞り込みと README の「既知の課題」を参照）。
icu_provider = { version = "2.4.0", features = ["logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8.7"
webp = "0.3.1"
notify = "8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSEvent"] }
# 画像のプレビュー（src/preview/cartridges/image.rs）で、ImageIO を使って向きを直した縮小版を作る。
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFURL", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGContext", "CGColorSpace", "CGBitmapContext", "CGDataProvider", "CGPDFDocument", "CGPDFPage"] }
# 動画のプレビュー（video.rs）で、AVAssetImageGenerator から 1 コマを取る。
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetImageGenerator", "AVTime", "objc2-core-foundation", "objc2-core-media", "objc2-core-graphics"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSProcessInfo", "NSURL", "NSString", "NSArray"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.dependencies]
# 落ちたときに小さな窓で知らせる（src/crash.rs）、管理者として動いているか見る（src/main.rs）、
# ツールチップの日時をこの PC の時刻にする（src/ui/tooltip.rs）。
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# DX12 も Vulkan も不安定な古い Intel GPU 向けに、`WGPU_BACKEND=gl` で OpenGL も選べるようにする
# （Bevy の既定では Windows に OpenGL が入らない）。版は Bevy が使う wgpu に合わせる。
wgpu = { version = "30.0.2", default-features = false, features = ["gles"] }
