[package]
name = "lisa"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
directories = "6.0.0"
# 日本語・中国語の改行位置データが無いという警告を、eprintln ではなくログとして出させて止めるため
# （main.rs のログの絞り込みと README の「既知の課題」を参照）。
icu_provider = { version = "2.4.0", features = ["logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
